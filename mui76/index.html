<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Component Gallery &mdash; MUI Theme Showcase</title>
    <!-- Classic Mac fonts are self-hosted; see src/fonts.css -->
    <!-- Lo-Fi Sketch theme uses Handlee (hand-drawn) + Fira Code from Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Web fonts per theme: Handlee (sketch), Noto Sans (BeOS),
         VT323 (CRT terminal), Open Sans (Frutiger Aero / Segoe stand-in) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Handlee&family=Fira+Code:wght@400;500&family=Noto+Sans:wght@400;500;700&family=VT323&family=Open+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
